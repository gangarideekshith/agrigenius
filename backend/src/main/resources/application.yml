# Shared configuration. Secrets are never stored here: they come from environment
# variables or from the gitignored root .env file (imported below as a properties file).
# Real environment variables take precedence over values in .env.

spring:
  application:
    name: agrigenius-backend
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  # No default profile on purpose: without one, API docs stay off (secure by default).
  # Developers run with the "local" profile; deployments set SPRING_PROFILES_ACTIVE=prod.

  datasource:
    # The running application connects as the least-privilege role (DB_USERNAME/DB_PASSWORD),
    # never as the schema owner. Missing values stop startup with an unresolved-placeholder error.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB}}
    username: ${agrigenius.database.app-role.username}
    password: ${agrigenius.database.app-role.password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Migrations run as the schema owner (the POSTGRES_* account from infra/docker-compose.yml).
    # The afterMigrate.sql callback then (re)creates the application role and grants it data-only access.
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true          # Never allow Flyway to wipe the database.

  http:
    clients:
      # HttpURLConnection-based client: no extra dependency and no NIO/Unix-domain socket
      # files (the JDK HttpClient fails on some Windows machines; see DEVELOPMENT.md).
      imperative:
        factory: simple

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      # Cache anonymous health results so public calls cannot flood the database or ML service.
      cache:
        time-to-live: 10s
      group:
        readiness:
          include: readinessState,db
      # DEGRADED (used for the optional ML service) ranks below UP, so it never
      # turns overall health DOWN; DOWN from the database still does.
      status:
        order: DOWN,OUT_OF_SERVICE,UP,DEGRADED,UNKNOWN
  info:
    env:
      enabled: true

info:
  app:
    name: AgriGenius Backend
    description: Spring Boot modular monolith for the AgriGenius platform

springdoc:
  # Off unless a profile turns it on (local does; prod does not).
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  paths-to-match: /api/**

agrigenius:
  database:
    app-role:
      manage: ${DB_MANAGE_APP_ROLE:true}
      username: ${DB_USERNAME:agrigenius_app}
      password: ${DB_PASSWORD}
  security:
    jwt:
      issuer: ${JWT_ISSUER:agrigenius}
      audience: agrigenius-api
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_MINUTES:30}m
    throttling:
      failed-logins-per-mobile: 5
      requests-per-ip: 20
      window: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ml-service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8001}
    connect-timeout: ${ML_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${ML_SERVICE_READ_TIMEOUT:5s}
    api-key: ${ML_SERVICE_API_KEY}
  recommendation:
    # Candidate confidence: HIGH >= high, MEDIUM >= medium, otherwise LOW (decision Q8).
    confidence:
      high: 0.60
      medium: 0.30
    throttle:
      per-user-per-hour: 30

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

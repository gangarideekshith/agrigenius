# Shared configuration. Secrets are never stored here: they come from environment
# variables or from the gitignored root .env file (imported below as a properties file).
# Real environment variables take precedence over values in .env.

spring:
  application:
    name: agrigenius-backend
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
  # No default profile on purpose: without one, API docs stay off (secure by default).
  # Developers run with the "local" profile; deployments set SPRING_PROFILES_ACTIVE=prod.

  datasource:
    # The running application connects as the least-privilege role (DB_USERNAME/DB_PASSWORD),
    # never as the schema owner. Missing values stop startup with an unresolved-placeholder error.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB}}
    username: ${agrigenius.database.app-role.username}
    password: ${agrigenius.database.app-role.password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Migrations run as the schema owner (the POSTGRES_* account from infra/docker-compose.yml).
    # The afterMigrate.sql callback then (re)creates the application role and grants it data-only access.
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true          # Never allow Flyway to wipe the database.

  http:
    clients:
      # HttpURLConnection-based client: no extra dependency and no NIO/Unix-domain socket
      # files (the JDK HttpClient fails on some Windows machines; see DEVELOPMENT.md).
      imperative:
        factory: simple

  # AI agriculture chatbot (ADR-0006). Both models are OFF unless explicitly enabled, so the app,
  # CI and tests never need an API key or a model download. With chat off the chat endpoints
  # answer 503 CHAT_DISABLED.
  ai:
    model:
      chat: ${CHAT_PROVIDER:none}               # anthropic | none
      embedding: ${EMBEDDING_PROVIDER:none}     # e5-onnx | none (custom ONNX model, ADR-0006)
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${CHAT_MODEL:claude-opus-5-5}
          max-tokens: ${CHAT_MAX_OUTPUT_TOKENS:1024}
    vectorstore:
      type: ${VECTOR_STORE_TYPE:none}            # pgvector | none (needs EMBEDDING_PROVIDER=e5-onnx)
      pgvector:
        initialize-schema: false                # Flyway owns knowledge_chunks (V4)
        schema-name: public
        table-name: knowledge_chunks
        dimensions: 384
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      # Cache anonymous health results so public calls cannot flood the database or ML service.
      cache:
        time-to-live: 10s
      group:
        readiness:
          include: readinessState,db
      # DEGRADED (used for the optional ML service) ranks below UP, so it never
      # turns overall health DOWN; DOWN from the database still does.
      status:
        order: DOWN,OUT_OF_SERVICE,UP,DEGRADED,UNKNOWN
  info:
    env:
      enabled: true

info:
  app:
    name: AgriGenius Backend
    description: Spring Boot modular monolith for the AgriGenius platform

springdoc:
  # Off unless a profile turns it on (local does; prod does not).
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  paths-to-match: /api/**

agrigenius:
  database:
    app-role:
      manage: ${DB_MANAGE_APP_ROLE:true}
      username: ${DB_USERNAME:agrigenius_app}
      password: ${DB_PASSWORD}
  security:
    jwt:
      issuer: ${JWT_ISSUER:agrigenius}
      audience: agrigenius-api
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_MINUTES:30}m
    throttling:
      failed-logins-per-mobile: 5
      requests-per-ip: 20
      window: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ml-service:
    base-url: ${ML_SERVICE_BASE_URL:http://localhost:8001}
    connect-timeout: ${ML_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${ML_SERVICE_READ_TIMEOUT:5s}
    api-key: ${ML_SERVICE_API_KEY}
  recommendation:
    # Candidate confidence: HIGH >= high, MEDIUM >= medium, otherwise LOW (decision Q8).
    confidence:
      high: 0.60
      medium: 0.30
    throttle:
      per-user-per-hour: 30
  chat:
    # Decisions C1, C9. Limits apply per farmer unless stated otherwise.
    effort: ${CHAT_EFFORT:low}
    messages-per-window: ${CHAT_MESSAGES_PER_10_MIN:20}
    window: 10m
    daily-message-limit: ${CHAT_DAILY_MESSAGE_LIMIT:40}
    daily-token-budget: ${CHAT_DAILY_TOKEN_BUDGET:2000000}   # all users together, input + output
    history-messages: 10
    max-content-chars: 2000
    max-messages-per-session: 200
    max-active-sessions: 50
    provider-timeout: 60s
  reminders:
    # Reminder system (docs/AGRI_GENIUS_ALARM_SYSTEM.md).
    default-time-zone: ${REMINDER_DEFAULT_TIME_ZONE:Asia/Kolkata}
    max-pending-per-farmer: 500
    max-days-ahead: 1095          # about 3 years
    past-grace: 2m                # tolerate small clock differences when "now" is picked
    upcoming-default-days: 7
    upcoming-max-days: 60
    list-limit: 100               # max items returned by /today, /upcoming and /overdue
    scanner:
      enabled: ${REMINDER_SCANNER_ENABLED:true}
      interval: ${REMINDER_SCAN_INTERVAL:PT1M}
      batch-size: 200
      max-batches-per-run: 20
  knowledge:
    top-k: 5
    similarity-threshold: ${CHAT_SIMILARITY_THRESHOLD:0.75}   # provisional; tuned on the gold set
    max-context-chars: 10000
    embedding-cache-dir: ${EMBEDDING_MODEL_CACHE_DIR:${user.home}/.agrigenius/embedding-models}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

name: ML service tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: this workflow only checks out code and runs tests.
permissions:
  contents: read

# Cancel superseded runs for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ml-service

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v

      # Verifies the committed dataset (checksum) and that the training pipeline still meets the
      # quality floor on it. The artifact is written to a temp dir and discarded (ADR-0005).
      - name: Verify dataset checksum
        run: echo "808e1d84a544647f1ab2fdae04f434b1842692d6be09eee18a5c2d43eb78d77c  data/raw/Crop_recommendation.csv" | sha256sum --check

      - name: Train crop model on committed dataset
        run: >
          python -m training.train_crop_model
          --csv data/raw/Crop_recommendation.csv
          --out "$RUNNER_TEMP/models/crop_recommendation"
          --version 1.0.0 --data-label DEMO_PUBLIC_DATASET --seed 42 --min-macro-f1 0.90

name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: this workflow only checks out code and runs the build.
permissions:
  contents: read

# Cancel superseded runs for the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unit, web-slice and Testcontainers integration tests (Docker is available on ubuntu runners).
      - name: Build and test
        run: ./mvnw -B -ntp verify
